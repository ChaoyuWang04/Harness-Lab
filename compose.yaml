name: harness-lab

services:
  ollama:
    image: ollama/ollama:0.33.3
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ./models/ollama:/root/.ollama/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 30

  chaos-proxy:
    profiles: ["m3"]
    build: .
    command: uvicorn app.chaos.proxy:app --host 0.0.0.0 --port 9000
    environment:
      CHAOS_UPSTREAM_URL: http://ollama:11434
      CHAOS_SEED: ${CHAOS_SEED:-0}
      CHAOS_429_RATE: ${CHAOS_429_RATE:-0}
      CHAOS_TIMEOUT_RATE: ${CHAOS_TIMEOUT_RATE:-0}
      CHAOS_5XX_RATE: ${CHAOS_5XX_RATE:-0}
      CHAOS_LATENCY_MS: ${CHAOS_LATENCY_MS:-0}
      CHAOS_TIMEOUT_SECONDS: ${CHAOS_TIMEOUT_SECONDS:-31}
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  lgtm:
    image: grafana/otel-lgtm:0.32.1
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - ./data/lgtm:/data
      - ./config/grafana/provisioning/datasources/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro
      - ./config/grafana/provisioning/dashboards/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/harness.yaml:ro
      - ./config/grafana/provisioning/alerting/rules.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/harness-rules.yaml:ro
      - ./config/grafana/dashboards/harness-slo.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/harness-slo.json:ro
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d harness"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: alembic upgrade head
    env_file: ./secrets/.env
    environment:
      DATABASE_URL: ${HARNESS_COMPOSE_DATABASE_URL:-postgresql+psycopg://postgres:harness@postgres:5432/harness}
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file: ./secrets/.env
    environment:
      DATABASE_URL: ${HARNESS_COMPOSE_DATABASE_URL:-postgresql+psycopg://postgres:harness@postgres:5432/harness}
      REDIS_URL: ${HARNESS_COMPOSE_REDIS_URL:-redis://redis:6379/0}
      LLM_BASE_URL: ${HARNESS_COMPOSE_LLM_BASE_URL:-http://ollama:11434/v1}
      HARNESS_OBSERVABILITY_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  dispatcher:
    build: .
    command: python -m app.dispatcher
    env_file: ./secrets/.env
    environment:
      DATABASE_URL: ${HARNESS_COMPOSE_DATABASE_URL:-postgresql+psycopg://postgres:harness@postgres:5432/harness}
      REDIS_URL: ${HARNESS_COMPOSE_REDIS_URL:-redis://redis:6379/0}
      LLM_BASE_URL: ${HARNESS_COMPOSE_LLM_BASE_URL:-http://ollama:11434/v1}
      CHAOS_DISPATCHER_CRASH_AFTER_PUBLISH: ${CHAOS_DISPATCHER_CRASH_AFTER_PUBLISH:-false}
      CHAOS_DISPATCHER_MARKER: /var/lib/harness-chaos/dispatcher-after-publish.once
      HARNESS_OBSERVABILITY_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    volumes:
      - ./data/chaos:/var/lib/harness-chaos
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker
    env_file: ./secrets/.env
    environment:
      DATABASE_URL: ${HARNESS_COMPOSE_DATABASE_URL:-postgresql+psycopg://postgres:harness@postgres:5432/harness}
      REDIS_URL: ${HARNESS_COMPOSE_REDIS_URL:-redis://redis:6379/0}
      LLM_BASE_URL: ${HARNESS_COMPOSE_LLM_BASE_URL:-http://ollama:11434/v1}
      HARNESS_TEST_PAUSE_AFTER_TOOL_SECONDS: ${HARNESS_TEST_PAUSE_AFTER_TOOL_SECONDS:-0}
      HARNESS_OBSERVABILITY_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  sweeper:
    build: .
    command: python -m app.sweeper
    env_file: ./secrets/.env
    environment:
      DATABASE_URL: ${HARNESS_COMPOSE_DATABASE_URL:-postgresql+psycopg://postgres:harness@postgres:5432/harness}
      REDIS_URL: ${HARNESS_COMPOSE_REDIS_URL:-redis://redis:6379/0}
      LLM_BASE_URL: ${HARNESS_COMPOSE_LLM_BASE_URL:-http://ollama:11434/v1}
      HARNESS_OBSERVABILITY_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
