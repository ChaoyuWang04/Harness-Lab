apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://127.0.0.1:9090
    editable: false
    jsonData:
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://127.0.0.1:3200
    editable: false
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: loki
  - name: Loki
    type: loki
    uid: loki
    url: http://127.0.0.1:3100
    editable: false
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: trace_id
          datasourceUid: tempo
          url: '$${__value.raw}'
